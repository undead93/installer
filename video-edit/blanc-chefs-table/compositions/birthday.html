<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      color: #fffaf0;
    }
    #bday-text {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 210px;
      text-align: right;
    }
    #bday-kicker {
      font-family: "Inter", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.45em;
      color: #e8c98f;
    }
    #bday-line {
      margin-top: 14px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 124px;
      line-height: 1.0;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55);
    }
    #bday-line span {
      display: inline-block;
      white-space: pre;
    }
    #bday-sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .spark {
      position: absolute;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      background: radial-gradient(circle, #fff6dc 0%, rgba(232, 201, 143, 0.9) 18%, rgba(232, 201, 143, 0) 62%);
      clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
    }
  </style>
  <div id="root" data-composition-id="birthday" data-width="1080" data-height="1920">
    <div id="bday-sparks" class="clip" data-start="0" data-duration="5.3" data-layout-ignore></div>
    <div id="bday-text" class="clip" data-start="0" data-duration="5.3">
      <div id="bday-inner">
        <div id="bday-kicker">AND FOR DESSERT</div>
        <div id="bday-line">Happy Birthday, Love</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Wish, letter by letter (split once at init; follows the "wish" variable)
    const wish = (window.__hyperframes && window.__hyperframes.getVariables().wish) || "Happy Birthday, Love";
    const line = document.querySelector("#bday-line");
    line.textContent = "";
    wish.split(" ").forEach((word, wi, all) => {
      [...word].forEach((ch) => {
        const s = document.createElement("span");
        s.className = "bday-letter";
        s.textContent = ch;
        line.appendChild(s);
      });
      if (wi < all.length - 1) line.appendChild(document.createElement("br"));
    });

    // Sparkles around the candle and the cake (fixed positions: deterministic)
    const sparks = [
      [150, 330, 0.75], [205, 280, 0.95], [118, 420, 1.1], [240, 380, 1.3],
      [300, 1080, 0.85], [190, 1150, 1.05], [420, 1120, 1.2], [360, 1260, 1.45],
      [130, 1250, 1.6], [470, 1000, 1.75], [260, 980, 1.9], [520, 1210, 2.1],
      [175, 250, 2.3], [330, 1340, 2.45], [95, 1050, 2.6], [450, 1330, 2.8]
    ];
    const host = document.querySelector("#bday-sparks");
    sparks.forEach(([x, y, t], i) => {
      const s = document.createElement("div");
      s.className = "spark";
      s.style.left = x + "px";
      s.style.top = y + "px";
      host.appendChild(s);
      const size = 0.6 + (i % 4) * 0.25;
      tl.fromTo(s, { scale: 0, opacity: 0, rotation: 0 }, { scale: size, opacity: 1, rotation: 45, duration: 0.35, ease: "power2.out" }, t);
      tl.to(s, { scale: 0, opacity: 0, rotation: 90, duration: 0.45, ease: "power2.in" }, t + 0.4);
    });

    tl.fromTo("#bday-kicker", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.45);
    document.querySelectorAll("#bday-line .bday-letter").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0.0, filter: "blur(6px)", y: 12 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "power3.out" }, 0.7 + i * 0.04);
    });
    tl.to("#bday-inner", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.05);
    window.__timelines["birthday"] = tl;
  </script>
</template>
